name: Keep Render Alive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 --retry 1 --retry-all-errors --retry-delay 10 \
            "${{ vars.RENDER_APP_URL }}/health"
